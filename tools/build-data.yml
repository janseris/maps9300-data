# Builds the Czech Republic data monthly from Geofabrik's OpenStreetMap extract and publishes it on
# GitHub Pages: https://<user>.github.io/<repo>/v1/...
name: build-data

on:
  schedule:
    - cron: "17 3 2 * *"      # the 2nd of every month, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: pip install osmium
      - name: Download the extract
        run: curl -fsSL -o cz.osm.pbf https://download.geofabrik.de/europe/czech-republic-latest.osm.pbf && ls -l cz.osm.pbf
      - name: Convert
        run: python tools/convert.py cz.osm.pbf site
      - name: Site files
        run: |
          cp README.md site/
          touch site/.nojekyll
          du -sh site; find site -type f | wc -l
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
